/* ================= piirto ================= */
function hsl2rgb(h,s,l){
  var C=(1-Math.abs(2*l-1))*s,X=C*(1-Math.abs((h/60)%2-1)),mm=l-C/2,r,g,b;
  if(h<60){r=C;g=X;b=0;}else if(h<120){r=X;g=C;b=0;}
  else if(h<180){r=0;g=C;b=X;}else if(h<240){r=0;g=X;b=C;}
  else if(h<300){r=X;g=0;b=C;}else{r=C;g=0;b=X;}
  return [((r+mm)*255)|0,((g+mm)*255)|0,((b+mm)*255)|0];
}

function drawMatrix(){
  var cv=document.getElementById("mtx");
  if(!cv)return;
  var m=S.m,CELL=Math.min(40,Math.max(1,Math.round(760/m.ncard)));
  var full=m.ncard*CELL,CAP=1400,sf=full>CAP?CAP/full:1;
  var W=Math.max(120,Math.round(full*sf));
  cv.width=W;cv.height=W;
  var x=cv.getContext("2d"),c,k;
  if(!m.pal){
    m.pal=new Uint8Array(m.nsym*3);
    for(k=0;k<m.nsym;k++){var rgb=hsl2rgb(k*360/m.nsym,.68,.56);
      m.pal[k*3]=rgb[0];m.pal[k*3+1]=rgb[1];m.pal[k*3+2]=rgb[2];}
  }
  if(CELL===1){
    var img=x.createImageData(W,W),d=img.data,i;
    for(i=0;i<d.length;i+=4){d[i]=14;d[i+1]=20;d[i+2]=48;d[i+3]=255;}
    for(c=0;c<m.ncard;c++){
      var sy=syms(m,c),px=(c*sf)|0;
      for(k=0;k<sy.length;k++){var r=sy[k],py=(r*sf)|0,o=(py*W+px)*4;
        d[o]=m.pal[r*3];d[o+1]=m.pal[r*3+1];d[o+2]=m.pal[r*3+2];d[o+3]=255;}
    }
    x.putImageData(img,0,0);
  }else{
    x.fillStyle="#0E1430";x.fillRect(0,0,W,W);
    for(c=0;c<m.ncard;c++){
      var sy2=syms(m,c),sel=S.mtx.indexOf(c)>=0;
      for(k=0;k<sy2.length;k++){var r2=sy2[k];
        x.globalAlpha=sel?1:.6;
        x.fillStyle="rgb("+m.pal[r2*3]+","+m.pal[r2*3+1]+","+m.pal[r2*3+2]+")";
        x.fillRect(c*CELL,r2*CELL,CELL,CELL);}
    }
    x.globalAlpha=1;
  }
  var g=Math.max(3,CELL*sf);
  x.fillStyle="rgba(255,201,74,.30)";
  S.mtx.forEach(function(cc){x.fillRect(cc*CELL*sf+CELL*sf/2-g/2,0,g,W);});
  if(S.mtx.length===2){
    var hit=shared(m,S.mtx[0],S.mtx[1]);
    x.fillRect(0,hit*CELL*sf+CELL*sf/2-g/2,W,g);
    x.strokeStyle="#FFC94A";x.lineWidth=Math.max(2,CELL*sf/2);
    var rad=Math.max(8,CELL*sf*1.6);
    S.mtx.forEach(function(cc){
      x.beginPath();x.arc(cc*CELL*sf+CELL*sf/2,hit*CELL*sf+CELL*sf/2,rad,0,Math.PI*2);x.stroke();});
  }
}

/* Etäisyys sivun alusta. getBoundingClientRect antaisi etäisyyden näkymän
   yläreunasta, jolloin korttien koko muuttuisi vierittäessä. */
function docTop(el){
  var y=0;
  while(el){y+=el.offsetTop||0;el=el.offsetParent;}
  return y;
}

/* Näkymän korkeus. Firefoxissa Androidilla innerHeight sisältää osoiterivin
   alta piiloon jäävän alueen, joten kortit asettuisivat väärään kohtaan. */
function vh(){
  try{
    if(window.visualViewport&&window.visualViewport.height)
      return window.visualViewport.height;
  }catch(e){}
  return window.innerHeight;
}

function fitStack(){
  var st=document.getElementById("pair");
  if(!st)return;
  var wide=window.innerWidth>vh()*1.05;
  st.classList.toggle("row",wide);
  st.style.width="";
  var box=st.parentNode.clientWidth;
  var below=document.getElementById("below");
  var reserve=(below?below.offsetHeight:0)+12;
  var availH=vh()-docTop(st)-reserve;
  var gap=8,w;
  if(wide)w=Math.min((box-gap)/2,availH);
  else w=Math.min(box,(availH-gap)/2);
  w=Math.max(130,Math.min(w,620));
  st.style.width=Math.round(wide?w*2+gap:w)+"px";
}

/* Korostaa oikean kuvan ja himmentää muut koskematta korttien sisältöön.
   Uudelleenpiirto juuri animaation alkaessa aiheutti töksähdyksen. */
/* Rengas animoidaan täsmälleen kerran kierrosta kohti, paikallisesti.
   Kun kuva on kerran korostettu, mikään myöhempi tapahtuma — palvelimen
   vahvistus, uudelleenpiirto tai tikitys — ei käynnistä animaatiota
   uudestaan. Tunnisteena on kierrosnumero, ei kuva: sama kuva voi osua
   kahdelle peräkkäiselle kierrokselle. */
/* Kehä luodaan kerran ja animaatio soitetaan suoraan sille. Jos kehä on jo
   paikallaan, mitään ei tehdä — silloin animaatio ei voi alkaa uudestaan. */
function lisaaKeha(el,animoi){
  if(!el)return;
  /* Viite katoaa kun kortti piirretään uusiksi, mutta kehä voi silti olla
     valmiina merkinnässä. Tarkistetaan myös se, jottei niitä tule kahta. */
  if(!el._keha&&el.querySelector)try{el._keha=el.querySelector(".ring");}catch(e){}
  if(el._keha)return;
  var r;
  try{
    r=document.createElement("i");
    r.className="ring";
    el.appendChild(r);
  }catch(e){return;}
  el._keha=r;
  if(!animoi)return;
  try{
    if(r.animate)r.animate(
      [{transform:"scale(.55)",opacity:0},{transform:"scale(1)",opacity:1}],
      {duration:340,easing:"cubic-bezier(.2,1.4,.45,1)"});
  }catch(e2){}
}

function poistaKeha(el){
  if(!el||!el._keha)return;
  try{el.removeChild(el._keha);}catch(e){}
  el._keha=null;
}

/* Tunnisteena jaon oma siemen, ei kierrosnumero. Siemen on satunnainen ja
   yksilöi kortin täsmällisesti, eikä sitä nollata missään — kierrosnumero
   nollaantui aina kun uusi kortti piirrettiin, jolloin suoja katosi ja
   seuraava korostus animoitui uudestaan. */
function korostaKortit(sym,siemen){
  var st=document.getElementById("pair");
  if(!st)return false;
  if(sym==null)return false;
  var slots=st.querySelectorAll(".slot");
  if(!slots||!slots.length)return false;
  /* Tämän kortin kehä on jo näytetty: ei kosketa mihinkään. */
  if(siemen!=null&&S.ringSeed===siemen)return true;
  for(var i=0;i<slots.length;i++){
    var el=slots[i],s=+((el.dataset&&el.dataset.s)||-1);
    if(s===sym){
      el.className="slot hit";
      lisaaKeha(el,true);
    }else{
      el.className="slot dim";
      poistaKeha(el);
    }
  }
  if(siemen!=null)S.ringSeed=siemen;
  return true;
}

/* Mitä korteilla näytetään: paljastus, oma odottava valinta vai pelattava
   kortti. Aiemmin tämä kulki #pair-elementin data-rev-attribuutin kautta,
   joka saattoi eriytyä varsinaisesta tilasta — silloin korostus katosi
   hetkeksi ja ilmestyi uudestaan. Nyt lähde on yksi ja sama. */
function naytettava(){
  if(!cardLive()&&S.reveal&&S.reveal.a!=null)return S.reveal;
  if(S.pending&&S.pendRev)return S.pendRev;
  return null;
}

function paintCards(){
  var uusiKeha=false;
  var st=document.getElementById("pair");
  if(!st)return;
  var discs=st.querySelectorAll(".disc"),i,dw,m,o={},kortit=null;
  if(S.tab!=="peli"){
    m=S.m;
    var t=shared(m,S.sel.a,S.sel.b);
    o={match:t,dim:t!=null,label:true};
    kortit=[S.sel.a,S.sel.b];
  }else if(S.screen==="solo"){
    m=modelFor(S.solo.q);o={seed:S.solo.seed,tap:!locked(),off:S.solo.off||0};
    kortit=[S.solo.a,S.solo.b];
  }else{
    m=modelFor((ROOM&&ROOM.q)||setupQ());
    var R=naytettava();
    if(R){
      o={seed:R.s||0,match:R.sym,dim:true,off:R.o||0};
      kortit=[R.a,R.b];
      /* Jos kehä syntyy vasta piirrossa, se animoidaan kerran jälkikäteen. */
      uusiKeha=(R.s==null||S.ringSeed!==R.s);
      if(R.s!=null)S.ringSeed=R.s;
    }else{
      o={seed:(ROOM&&ROOM.deal&&ROOM.deal.s)||0,off:(ROOM&&ROOM.deal&&ROOM.deal.o)||0,
        tap:cardLive()&&!S.pending&&!locked()};
      kortit=(ROOM&&ROOM.deal)?[ROOM.deal.a,ROOM.deal.b]:null;
      /* HUOM: S.ringSeed EI nollaudu tässä. Uudella kortilla on uusi
         siemen, joten kehä animoituu silti — mutta jo näytetty ei toistu. */
    }
  }
  if(!kortit)return;

  /* Korttinumerot tulevat tilasta, eivät DOM-attribuutista. Attribuutin
     päivitti vain täysi piirto, joten kevyellä polulla ruudulle saattoi
     jäädä edellisen kierroksen kortit — ja napautus hyväksyttiin niihin. */
  var piirretty=false;
  for(i=0;i<discs.length&&i<kortit.length;i++){
    dw=discs[i].clientWidth;
    if(!dw)continue;
    var c=kortit[i];
    if(discs[i].dataset)discs[i].dataset.c=c;
    var oo={seed:o.seed,tap:o.tap,match:o.match,dim:o.dim,off:o.off};
    if(o.label)oo.label=c+1;
    discs[i].innerHTML=cardHTML(m,c,dw,oo);
    piirretty=true;
  }

  /* Mikä jako on todella ruudulla. Merkitään vasta kun kortit on oikeasti
     piirretty: muuten napautus kelpaisi vaikka ruudulla olisi vanha kortti. */
  if(S.tab==="peli"&&S.screen!=="solo"){
    if(!piirretty)S.shownDeal=null;
    else S.shownDeal=(naytettava()==null&&ROOM&&ROOM.deal)?ROOM.deal.s:null;
  }

  /* Piirrossa syntynyt kehä animoidaan kerran. */
  if(uusiKeha&&piirretty&&st)try{
    var kehat=st.querySelectorAll(".ring");
    for(i=0;i<kehat.length;i++)if(kehat[i].animate)kehat[i].animate(
      [{transform:"scale(.55)",opacity:0},{transform:"scale(1)",opacity:1}],
      {duration:340,easing:"cubic-bezier(.2,1.4,.45,1)"});
  }catch(e){}
}

/* Kesken pelin otsikko ja välilehdet piilotetaan, jotta kortit saavat tilan.
   Poistuminen hoituu tilapalkin painikkeesta. */
function inPlay(){
  if(S.tab!=="peli")return false;
  if(S.screen==="solo")return true;
  if(S.screen==="mp"&&roomState()==="play"&&ROOM&&ROOM.roster&&ROOM.roster[S.me.id])return true;
  return false;
}

function render(){
  /* Jos säädintä vedetään juuri nyt, piirtäminen odottaa: muuten elementti
     katoaisi sormen alta kesken vedon. */
  if(S.dragging){S.needRender=true;return;}
  S.needRender=false;
  /* Kesken kirjoitettu kenttä säilyy piirron yli. Koskee nimeä, aulakoodia
     ja korttinumeroita — mikä tahansa niistä voi olla kohdistettuna kun
     verkosta saapuu päivitys. */
  var ae=null;
  try{ae=document.activeElement;}catch(e){}
  var keep=(ae&&ae.id&&ae.tagName==="INPUT"&&ae.type!=="range")?
    {id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd}:null;
  /* Kohdistus palautetaan vain jos kenttään on juuri kirjoitettu. Muuten
     .focus() avaisi näppäimistön uudelleen joka kerta kun jokin muu
     pelaaja tekee jotain. */
  var kirjoittaa=!!(keep&&S.typeId===keep.id&&nowMs()-(S.typeT||0)<1500);

  var body=S.tab==="peli"?viewPlay():S.tab==="pakka"?viewDeck():viewStruct();
  var bare=inPlay();
  var inRoom=(S.tab==="peli"&&S.screen==="mp");
  /* Pelin aikana sivu ei saa vieriä; kortit mitoitetaan näkymään. */
  try{
    var de=document.documentElement,bo=document.body;
    var lukko=bare||(S.tab==="pakka");
    /* Vieritys on nollattava ENNEN lukitusta. Muuten sivu jää siihen
       kohtaan mihin se oli vieritetty, eikä sitä pääse enää liikuttamaan —
       yläpalkki jää näkymän yläpuolelle. */
    if(lukko&&!S.lukossa)try{window.scrollTo(0,0);}catch(e2){}
    S.lukossa=lukko;
    if(de&&de.classList)de.classList.toggle("pelissa",lukko);
    if(bo&&bo.classList)bo.classList.toggle("pelissa",lukko);
  }catch(e){}
  /* Välilehdet piiloon pelin ja aulan sisällä: sieltä poistutaan
     takaisin- ja sulkemispainikkeilla. */
  var tabs=(!bare&&!inRoom)?tabsHTML():"";
  /* Pelitavan valinta välilehtien alapuolelle. */
  var modes=(S.tab==="peli"&&!bare&&!inRoom&&!S.blocked)?modeHTML():"";
  var ladder=(S.tab==="peli")?"":ladderHTML();
  /* Vanhasta versiosta kerrotaan joka välilehdellä, ei vain pelisivulla. */
  var varoitus=(S.blocked&&S.tab!=="peli")?
    ('<p class="need"><b>Vanha versio.</b> Peli on päivittynyt versioon v'+S.blocked.min+
     '. <button class="lnk" id="hardreset">Päivitä nyt</button></p>'):"";
  var top=bare?"":'<div class="toph"><b>Dobble</b></div>';
  app.innerHTML=top+varoitus+ladder+tabs+modes+body;

  if(keep){
    var el=document.getElementById(keep.id);
    if(el){
      el.value=keep.v;
      if(kirjoittaa)try{el.focus();el.setSelectionRange(keep.s,keep.e);}catch(e){}
    }
  }
  /* Pidetään tikityksen vertailuarvo ajan tasalla, ettei se laukaisisi
     ylimääräistä piirtoa kesken paljastuksen. */
  if(S.screen==="mp"&&S.tab==="peli")S.wasLive=cardLive();
  requestAnimationFrame(function(){
    fitStack();paintCards();drawMatrix();paintDot();
    var cl=document.getElementById("chatlog");
    if(cl)try{cl.scrollTop=cl.scrollHeight;}catch(e){}
  });
}

setInterval(function(){
  if(S.tab!=="peli")return;
  var need=false;
  if(S.screen==="mp"&&S.tab==="peli"&&
     (roomState()==="play"||roomState()==="done")){
    var lv=cardLive();
    if(lv!==S.wasLive){S.wasLive=lv;need=true;}
    else if(!lv){
      var cd=document.getElementById("cdn");
      if(cd)cd.textContent=(waitMs()/1000).toFixed(1);
    }
  }
  if(S.lock&&!locked()){S.lock=0;piilotaSakko();need=true;}
  if(need){render();return;}
  if(locked())naytaSakko();
  else piilotaSakko();
  var c=document.getElementById("clk");
  if(c&&S.screen==="solo")c.textContent=((nowMs()-S.solo.t0)/1000).toFixed(1);
},100);

setInterval(function(){if(S.screen==="mp"){hostArbitrate();hostFinalize();hostRescue();}},1200);
setInterval(function(){if(S.screen==="lobbies")loadLobbies();},3000);

/* ================= tapahtumat ================= */
function goto(where){
  S.sig=null;S.lock=0;piilotaSakko();S.reveal=null;S.pendRev=null;S.pending=false;hideToast();
  if(where!=="mp"&&S.code)leaveRoom();
  S.screen=where;
  if(where==="lobbies"){
    checkVersion();
    S.lobbies=[];S.lobSig=null;S.lobErr=null;lobTries=0;
    loadLobbies();
    setTimeout(function(){if(S.screen==="lobbies")loadLobbies();},900);
  }
  window.scrollTo(0,0);render();
}

function enterRoom(code){
  if(S.blocked)return;
  code=String(code||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
  if(code.length!==4)return;
  if(S.code)leaveRoom();
  joinRoom(code);
  S.screen="mp";S.reveal=null;S.pendRev=null;S.pending=false;S.lock=0;hideToast();
  window.scrollTo(0,0);render();
}

app.addEventListener("click",function(e){
  if(e.target.id==="mtx"){
    var cv=e.target,rc=cv.getBoundingClientRect();
    var col=Math.floor((e.clientX-rc.left)/rc.width*S.m.ncard);
    if(col<0||col>=S.m.ncard)return;
    var ix=S.mtx.indexOf(col);
    if(ix>=0)S.mtx.splice(ix,1);
    else if(S.mtx.length===2)S.mtx=[S.mtx[1],col];
    else S.mtx.push(col);
    render();return;
  }
  audioOn();                                   /* avataan äänilupa ajoissa */
  if(e.target.id==="dot"){reconnect();return;}
  if(e.target.closest&&e.target.closest("#mute")){
    MUTE=!MUTE;
    try{localStorage.setItem("dobble_mute",MUTE?"1":"0");}catch(err){}
    render();return;
  }
  var t=e.target.closest("button");
  if(!t||t.disabled)return;

  if(t.dataset.go){goto(t.dataset.go);return;}
  if(t.dataset.join){enterRoom(t.dataset.join);return;}
  if(t.id==="mklobby"){enterRoom(newCode());return;}
  if(t.id==="hardreset"){hardReset();return;}
  if(t.id==="send"){lahetaViesti();return;}
  if(t.id==="copylink"){
    var u=joinURL();
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(u).then(function(){
          S.copied=true;render();
          setTimeout(function(){S.copied=false;if(S.screen==="mp")render();},1600);
        }).catch(function(){});
    }catch(e){}
    return;
  }
  if(t.id==="jgo"){
    var f=document.getElementById("jcode");
    if(f)enterRoom(f.value);
    return;
  }
  if(t.id==="ladt"){S.lad=!S.lad;render();return;}
  if(t.dataset.tab){
    var nt=t.dataset.tab;
    if(S.tab==="peli"&&nt!=="peli"&&S.code)leaveRoom();
    S.tab=nt;window.scrollTo(0,0);render();return;
  }
  if(t.id==="gosolo"){soloStart();return;}
  if(t.id==="gostart"){hostStart();return;}
  if(t.id==="goreset"){hostReset();return;}
  if(t.id==="gostop"){hostStop();return;}

  if(t.dataset.q!==undefined){
    var q=+t.dataset.q,r=null,i;
    for(i=0;i<RUNGS.length;i++)if(RUNGS[i].q===q)r=RUNGS[i];
    if(r.st){S.msg={text:r.why,open:r.st==="open"};render();}
    else{S.q=q;S.msg=null;S.lad=false;S.m=modelFor(q);S.sel={a:0,b:1};S.mtx=[];render();}
    return;
  }
  if(t.id==="rndpair"){
    var n=S.m.ncard,a=Math.floor(Math.random()*n),b=Math.floor(Math.random()*(n-1));
    if(b>=a)b++;
    if(Math.random()<0.5){var tt=a;a=b;b=tt;}
    S.sel={a:a,b:b};render();return;
  }
  if(t.dataset.nudge){
    var key=t.dataset.nudge,d=+t.dataset.d,N=S.m.ncard;
    S.sel[key]=(S.sel[key]+d+N)%N;render();return;
  }
  if(t.dataset.card!==undefined){
    var ci=+t.dataset.card;
    if(ci!==S.sel.a&&ci!==S.sel.b){S.sel.b=S.sel.a;S.sel.a=ci;render();}
    return;
  }

  if(t.dataset.s!==undefined&&S.tab==="peli"){
    if(locked()||S.blocked)return;
    var sym=+t.dataset.s;
    if(S.screen==="solo"){
      var P=S.solo,mm=modelFor(P.q),tg=shared(mm,P.a,P.b);
      if(sym===tg){
        soitaBling();
        P.score++;
        if(P.round>=P.cards){P.tEnd=nowMs();S.screen="solo-done";render();return;}
        P.round++;soloDeal();render();
      }else{soitaTok();P.miss++;penalise();naytaSakko();render();}
      return;
    }
    /* Kortti voi olla "elossa" hetkeä ennen kuin se ehditään piirtää.
       Silloin ruudulla on vielä edellinen kortti, eikä sen kuvia saa
       hyväksyä — muuten rengas piirtyisi vanhaan asetteluun ja sitten
       uudestaan uuteen. */
    if(S.screen==="mp"&&roomState()==="play"&&!S.pending&&cardLive()&&
       ROOM&&ROOM.deal&&S.shownDeal===ROOM.deal.s&&
       ROOM&&ROOM.roster&&ROOM.roster[S.me.id]){
      var m2=modelFor(ROOM.q||7),tg2=shared(m2,ROOM.deal.a,ROOM.deal.b);
      if(sym!==tg2){soitaTok();penalise();naytaSakko();paintCards();return;}
      /* Painaja tarkisti vastauksen jo paikallisesti, joten kuva korostetaan
         heti odottamatta palvelinta. Nimi ilmestyy kun voittaja on ratkennut. */
      soitaBling();
      S.pending=true;
      /* Vain oma palaute: ei siirrä seuraavan kortin heräämistä. */
      S.pendRev={a:ROOM.deal.a,b:ROOM.deal.b,s:ROOM.deal.s,o:ROOM.deal.o||0,
        sym:sym,r:ROOM.round||1};
      /* Vain kortit uusiksi. Koko sivun piirto nykäisisi juuri kun
         korostusrenkaan animaatio alkaa. */
      if(!korostaKortit(sym,ROOM.deal.s))paintCards();
      put("/claims/"+(ROOM.round||1)+"/"+S.me.id,
        {n:S.me.name.slice(0,18),y:sym,t:{".sv":"timestamp"}});
      /* Varmistus siltä varalta ettei vastausta kuulu. Vanha ajastin on
         peruttava ja uuden on tunnistettava OMA painalluksensa: muuten
         edellisen kierroksen ajastin sammuttaisi juuri tehdyn korostuksen. */
      clearTimeout(S.pendT);
      var omaSiemen=ROOM.deal.s;
      S.pendT=setTimeout(function(){
        if(S.pending&&S.pendRev&&S.pendRev.s===omaSiemen){
          S.pending=false;S.pendRev=null;
          if(S.tab==="peli"&&S.screen==="mp")render();
        }
      },2600);
    }
    return;
  }
});

/* Liu'ut päivittävät lukeman ilman koko sivun piirtoa, jotta veto ei katkea. */
app.addEventListener("input",function(e){
  var t=e.target;
  if(t&&t.id&&t.tagName==="INPUT"){S.typeId=t.id;S.typeT=nowMs();}
  if(t.id==="nick"){
    var v=t.value.trim().slice(0,18);
    if(!v)return;
    S.me.name=v;
    try{localStorage.setItem("dobble_name",v);}catch(err){}
    clearTimeout(S.nickT);
    S.nickT=setTimeout(function(){beat();paintBoard();},400);
    return;
  }
  if(t.id==="jcode"){
    var cv=t.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
    if(cv!==t.value){
      var pos=t.selectionStart;
      t.value=cv;
      try{t.setSelectionRange(pos,pos);}catch(err){}
    }
    return;
  }
  if(t.id==="slq"||t.id==="slc"){
    /* Vedon aikana päivitetään vain lukemat. Koko sivun piirtäminen tuhoaisi
       säätimen kesken kaiken, jolloin veto katkeaisi. */
    if(t.id==="slq")S.setup.qi=+t.value;else S.setup.cards=+t.value;
    var lq=document.getElementById("labq"),lc=document.getElementById("labc"),
        sb=document.getElementById("optsub");
    if(lq)lq.textContent=setupQ()+1;
    if(lc)lc.textContent=S.setup.cards;
    if(sb)sb.textContent=subTeksti(setupQ(),S.setup.cards);
    paintPreview();
  }
});

app.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="slq"||t.id==="slc"){
    /* change laukeaa vasta kun ote irtoaa. */
    if(t.id==="slq")S.setup.qi=+t.value;else S.setup.cards=+t.value;
    modelFor(setupQ());pushSetup();render();
    return;
  }
  if(t.id==="nick"){
    var v=t.value.trim().slice(0,18);
    if(v){S.me.name=v;try{localStorage.setItem("dobble_name",v);}catch(err){}beat();}
    else t.value=S.me.name;
    return;
  }
  if(t.dataset&&t.dataset.in){
    var v2=parseInt(t.value,10);
    if(!isNaN(v2)&&v2>=1&&v2<=S.m.ncard){S.sel[t.dataset.in]=v2-1;render();}
  }
});

app.addEventListener("keydown",function(e){
  if(e.target.id==="jcode"&&e.key==="Enter")enterRoom(e.target.value);
  if(e.target.id==="msg"&&e.key==="Enter"){e.preventDefault();lahetaViesti();}
});

/* Pyyhkäisy vaihtaa yksinpelin ja moninpelin välillä aloitussivuilla.
   Ei reagoi säätimiin eikä pystysuuntaiseen vieritykseen. */
var swipe=null;

function swipeOk(t){
  if(S.tab!=="peli"||S.blocked||S.dragging)return false;
  if(S.screen!=="solo-setup"&&S.screen!=="lobbies")return false;
  if(t&&t.tagName==="INPUT")return false;
  if(t&&t.classList&&t.classList.contains("sl"))return false;
  return true;
}

app.addEventListener("touchstart",function(e){
  if(!e.touches||e.touches.length!==1||!swipeOk(e.target)){swipe=null;return;}
  swipe={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),ok:true};
},{passive:true});

app.addEventListener("touchmove",function(e){
  if(!swipe||!e.touches||e.touches.length!==1){swipe=null;return;}
  var dx=e.touches[0].clientX-swipe.x,dy=e.touches[0].clientY-swipe.y;
  /* Pystyliike tulkitaan vieritykseksi, jolloin pyyhkäisy perutaan. */
  if(Math.abs(dy)>18&&Math.abs(dy)>Math.abs(dx))swipe.ok=false;
},{passive:true});

app.addEventListener("touchend",function(e){
  var s=swipe;swipe=null;
  if(!s||!s.ok||!e.changedTouches||!e.changedTouches.length)return;
  if(!swipeOk(e.target))return;
  var dx=e.changedTouches[0].clientX-s.x,dy=e.changedTouches[0].clientY-s.y;
  if(Date.now()-s.t>700)return;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6)return;
  var solo=(S.screen==="solo-setup");
  if(dx<0&&solo){if(netOn())goto("lobbies");}
  else if(dx>0&&!solo)goto("solo-setup");
});

/* Vedon tunnistus, jotta uudelleenpiirto voidaan lykätä sen ajaksi. */
function dragOn(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("sl"))S.dragging=true;
}
function dragOff(){
  if(!S.dragging)return;
  S.dragging=false;
  if(S.needRender)render();
}
app.addEventListener("pointerdown",dragOn);
app.addEventListener("touchstart",dragOn,{passive:true});
window.addEventListener("pointerup",dragOff);
window.addEventListener("pointercancel",dragOff);
window.addEventListener("touchend",dragOff);
window.addEventListener("touchcancel",dragOff);

/* Sovellukseen palatessa tarkistetaan versio heti. */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){checkVersion();watchVersion();}
});

var rt=null;
function sovitaMyohemmin(){
  clearTimeout(rt);rt=setTimeout(function(){fitStack();paintCards();},150);
}
window.addEventListener("resize",sovitaMyohemmin);
/* Osoiterivin piiloutuminen muuttaa näkymän korkeutta ilman resize-viestiä. */
try{
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",sovitaMyohemmin);
    window.visualViewport.addEventListener("scroll",sovitaMyohemmin);
  }
}catch(e){}
/* Sivun sulkeutuessa EI poisteta pelaajaa: päivityksessä poisto ehtisi usein
   uuden sivun liittymisen jälkeen ja pyyhkisi sen pois. Vanhentuneet rivit
   suodattuvat muutenkin 12 sekunnissa. Nappia painamalla poistutaan heti. */

/* ================= käynnistys ================= */
netInit();
checkVersion();
watchVersion();
S.m=modelFor(S.q);
S.screen=netOn()?"lobbies":"solo-setup";
var hash="";
try{hash=(location.hash||"").replace("#","").toUpperCase().replace(/[^A-Z]/g,"");}catch(e){}
if(netOn()&&hash.length===4)enterRoom(hash);
else{if(S.screen==="lobbies")loadLobbies();render();}

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

</script>
